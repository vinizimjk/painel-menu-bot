
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar • Painel /menu</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="login-wrap">
    <section class="login-card">
      <div class="brand">⚙️</div>
      <h1>Painel do /menu</h1>
      <p>Entre com a senha de administrador.</p>

      {% with messages = get_flashed_messages() %}
        {% for message in messages %}
          <div class="alert">{{ message }}</div>
        {% endfor %}
      {% endwith %}

      <form method="post">
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" required autocomplete="current-password" placeholder="Sua senha">
        <button type="submit">Entrar</button>
      </form>
    </section>
  </main>
</body>
</html>

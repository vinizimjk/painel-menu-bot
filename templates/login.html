<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resenha Máxima • Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="login-wrap">
    <section class="login-card">
      <div class="brand-mark login-brand">RM</div>
      <span class="eyebrow gold">CENTRAL OFICIAL</span>
      <h1>Resenha Máxima</h1>
      <p>
        Entre com sua conta do painel. O administrador principal
        também pode continuar usando somente a senha mestre.
      </p>

      {% with messages = get_flashed_messages() %}
        {% for message in messages %}
          <div class="success">{{ message }}</div>
        {% endfor %}
      {% endwith %}

      <form method="post">
        <label>Usuário</label>
        <input
          name="usuario"
          placeholder="Opcional para acesso mestre"
          autocomplete="username"
        >

        <label>Senha</label>
        <input
          name="senha"
          type="password"
          required
          autocomplete="current-password"
        >

        <button type="submit">
          Entrar no painel
        </button>
      </form>
    </section>
  </main>
</body>
</html>

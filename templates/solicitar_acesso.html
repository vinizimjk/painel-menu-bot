<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solicitar acesso • Resenha Máxima</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body style="padding-left:0"><main class="login-wrap"><section class="login-card"><img class="login-logo" src="{{ url_for('static', filename='logo_resenha_maxima.png') }}"><div class="login-title"><span class="eyebrow gold">NOVO ACESSO</span><h1>Solicitar acesso</h1><p>Informe seu Discord. O bot verifica seu nome no servidor antes de enviar para a administração.</p></div>{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="alert">{{ m }}</div>{% endfor %}{% endwith %}<form method="post"><label>ID do Discord</label><input name="discord_id" required inputmode="numeric" placeholder="Ex.: 1174877728281985124"><label>Usuário desejado</label><input name="usuario" required placeholder="Seu usuário do painel"><label>Senha desejada</label><input name="senha" type="password" minlength="6" required placeholder="Mínimo 6 caracteres"><button>Enviar solicitação</button></form><p class="login-help"><a href="{{ url_for('login') }}">← Voltar para o login</a></p></section></main></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verificar conta • Resenha Máxima</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="login-wrap"><section class="login-card"><div class="login-title"><span class="eyebrow gold">VERIFICAÇÃO</span><h1>Confirme sua conta</h1><p>Abra a DM enviada pelo bot, confirme que foi você e cole abaixo o token de 25 caracteres.</p></div>{% with messages=get_flashed_messages() %}{% for message in messages %}<div class="alert">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><label>Token</label><input name="token" maxlength="25" minlength="25" required autocomplete="one-time-code" placeholder="25 caracteres"><button type="submit">Confirmar e criar conta</button></form><p class="login-help">O token expira em 10 minutos e funciona uma única vez.</p></section></main></body></html>
